<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Подтверждение прав в Яндекс Вебмастере (мета-тег) -->
    <meta name="yandex-verification" content="9db426e4e63d4058"/>

    <!-- ВАШ номер группы и фамилия -->
    <meta name="student-id" content="IVT-21-Ivanov">

    <!-- SEO: заголовок 10-70 символов -->
    <title>Учебный сайт Иванова | лаборатория вебмастера</title>

    <!-- SEO: описание 50-160 символов -->
    <meta name="description" content="Учебный сайт студента Иванова, созданный для лабораторной работы по настройке индексации в Яндекс Вебмастере: robots.txt, sitemap.xml и SEO.">

    <!-- Open Graph: корректное отображение ссылки в соцсетях и поиске -->
    <meta property="og:title" content="Учебный сайт Иванова — лаборатория вебмастера">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://assx142.github.io/webmaster-lab/">
    <meta property="og:description" content="Лабораторная работа по регистрации сайта в Яндекс Вебмастере, подтверждению прав и базовой SEO-настройке.">
    <meta property="og:image" content="https://assx142.github.io/webmaster-lab/og-image.png">

    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 40px; line-height: 1.6; background: #f7f9fc; color: #222; }
        main { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #e3e8ee; border-radius: 12px; padding: 32px; }
        h1 { margin-top: 0; color: #1a3c6e; }
        code { background: #eef2f7; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>Лаборатория вебмастера</h1>
        <p>Это главная страница учебного сайта. Здесь размещены мета-теги подтверждения прав для <strong>Яндекс Вебмастера</strong>, базовые SEO-теги и разметка Open Graph.</p>
        <p>На сайте настроены технические файлы: <code>robots.txt</code> и <code>sitemap.xml</code>.</p>
    </main>
</body>
</html>
